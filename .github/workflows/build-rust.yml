name: Build Rust Natives
on:
  push:
    branches:
      - main
    paths:
      - 'sable_rapier/src/main/rust/**'
      - '.github/workflows/build-rust.yml'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/sable_rapier/build/cargo
          key: ${{ runner.os }}-node-${{ hashFiles('sable_rapier/src/main/rust/**/Cargo.lock') }}

      - name: Run Gradle Task
        run: ./gradlew sable_rapier:buildImages sable_rapier:buildRustNatives

      - name: Take ownership of the workspace
        run: sudo chown -R $USER:$USER .

      - name: Upload natives artifact
        uses: actions/upload-artifact@v4
        with:
          name: sable-rapier-natives
          path: sable_rapier/src/main/resources/natives/sable_rapier/sable_rapier_binaries.zip.l4z
          retention-days: 30
