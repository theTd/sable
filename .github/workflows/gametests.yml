name: build
on:
  push:
    paths:
      - 'common/src/main/java/**'
      - 'fabric/src/main/java/**'
      - 'neoforge/src/main/java/**'
      - '**/gradle.properties'
      - '**/settings.gradle'
      - '**/build.gradle'
      - '.github/workflows/gametests.yml'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sable_rapier/src/main/rust/target
          key: ${{ runner.os }}-cargo-gametest-${{ hashFiles('sable_rapier/src/main/rust/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gametest-

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Run game tests
        run: ./gradlew neoforge:runGameTest
